<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveLife Pro - وێبئەپی وەرزش و وزە</title>
    <style>
        :root {
            --primary: #FF5722;
            --primary-hover: #E64A19;
            --bg: #121212;
            --card-bg: #1E1E1E;
            --text: #FFFFFF;
            --text-secondary: #B0BEC5;
            --accent: #4CAF50;
            --category-bg: #2C2C2C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-size: 0.9rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .quote-card {
            border-right: 4px solid var(--primary);
            background: linear-gradient(135deg, #251a17 0%, var(--card-bg) 100%);
            text-align: start;
        }

        [dir="ltr"] .quote-card {
            border-right: none;
            border-left: 4px solid var(--primary);
        }

        .quote-card p {
            font-size: 1.1rem;
            font-style: italic;
            color: #E0E0E0;
        }

        .category-badge {
            display: inline-block;
            background: var(--category-bg);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .workout-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--text);
        }

        .workout-desc {
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
            min-height: 50px;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 15px 0;
            font-family: monospace;
            color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.secondary {
            background: #333;
            color: var(--text-secondary);
        }

        button.secondary:hover {
            background: #444;
            color: white;
        }

        button.danger {
            background: #D32F2F;
        }

        button.danger:hover {
            background: #B71C1C;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 5px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">⚡ وزەی بێپایان</h1>
        <select id="lang-select" onchange="changeLanguage(this.value)">
            <option value="ckb">کوردی</option>
            <option value="ar">العربية</option>
            <option value="en">English</option>
        </select>
    </header>

    <div class="container">
        <!-- Motivational Quote -->
        <div class="card quote-card">
            <p id="quote-text">"بەردەوامی کلیلی سەرکەوتنە. ئەمڕۆ هەنگاوێک لە دوێنێ بچۆ پێشتر!"</p>
        </div>

        <!-- Exercise Card -->
        <div class="card">
            <span class="category-badge" id="workout-category">کاردیۆ</span>
            <h2 class="workout-title" id="workout-title">ڕاهێنان</h2>
            <p class="workout-desc" id="workout-desc">توضیح</p>
            
            <div class="timer-display" id="timer">00:30</div>

            <div class="btn-group">
                <button id="btn-start" onclick="toggleTimer()">دەستپێکردن</button>
                <button id="btn-next" class="secondary" onclick="nextWorkout()">ڕاهێنانی تر ↻</button>
            </div>
        </div>

        <!-- Activity Stats -->
        <div class="stats-grid">
            <div class="stat-box">
                <span id="stat-completed-label">ڕاهێنانی تەواوکراو</span>
                <div class="stat-number" id="stat-count">0</div>
            </div>
            <div class="stat-box">
                <span id="stat-energy-label">ئاستی وزە</span>
                <div class="stat-number" id="stat-energy">100% 🔥</div>
            </div>
        </div>

        <button class="secondary danger" style="width: 100%; text-align: center;" id="btn-reset-stats" onclick="resetStats()">پاککردنەوەی ئامارەکان 🗑️</button>
    </div>

    <script>
        // Web Audio API Sound Generator for finish beep
        function playFinishSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {
                console.log("Audio not supported or blocked");
            }
        }

        // Translations & Expanded Workouts Data (Cardio, Strength, Yoga/Stretching)
        const i18n = {
            ckb: {
                dir: "rtl",
                title: "⚡ وزەی بێپایان",
                quotes: [
                    '"بەردەوامی کلیلی سەرکەوتنە. ئەمڕۆ هەنگاوێک لە دوێنێ بچۆ پێشتر!"',
                    '"وزە دروست دەبێت کاتێک دەست بە جوڵە دەکەیت!"',
                    '"بەهێزتر بە لەو پاساوانەی کە دەیان هێنیتەوە."',
                    '"تەنها ۳۰ چرکە ڕاهێنان دەتوانێت تەواوی ڕۆژەکەت بگوڕێت."'
                ],
                workouts: [
                    { category: "🔥 کاردیۆ", title: "بازدانی پەپوولەیی (Jumping Jacks)", desc: "بە بازدانەوە دەست و قاچەکانت بکەرەوە و دابخەرەوە بۆ بەرزکردنەوەی لێدانی دڵ." },
                    { category: "💪 هێز", title: "شناو (Push-ups)", desc: "جەستەت ڕێک ڕاگرە و هێز بخەرە سەر سنگ و قۆڵت." },
                    { category: "🧘 يۆگا و خاوبوونەوە", title: "کێشانی پشیلە و چێڵ (Cat-Cow Pose)", desc: "لە سەر چۆک دابنیشه و پشتی خۆت بە خێنچی بەرەو سەرەوە و خوارەوە بجوڵێنە بۆ حەسانەوەی بڕبڕەی پشت." },
                    { category: "💪 هێز", title: "سکوات (Squats)", desc: "بچۆ خوارەوە وەک ئەوەی لەسەر کورسی دابنیشیت، قاچەکانت بەهێز بکە." },
                    { category: "🔥 کاردیۆ", title: "ڕاکردنی بەرزکەرەوەی چۆک (High Knees)", desc: "لە شوێنی خۆتدا چۆکەکانت بە بەرزی بەرز بکەرەوە بە شێوەی ڕاکردن." },
                    { category: "💪 هێز", title: "پلانک (Plank)", desc: "سکی خۆت توند بکە و جەستەت بە تەواوی بە ڕێکی ڕابگرە." }
                ],
                btnStart: "دەستپێکردن",
                btnPause: "وەستان",
                btnNext: "ڕاهێنانی تر ↻",
                statCompleted: "ڕاهێنانی تەواوکراو",
                statEnergy: "ئاستی وزە",
                btnReset: "پاککردنەوەی ئامارەکان 🗑️",
                alertFinished: "دەستخۆش! ڕاهێنانەکەت بە سەرکەوتوویی تەواو کرد 🎉"
            },
            ar: {
                dir: "rtl",
                title: "⚡ الطاقة اللافياتية",
                quotes: [
                    '"الاستمرارية هي مفتاح النجاح. خذ خطوة للأمام اليوم!"',
                    '"الطاقة تتولد عندما تبدأ بالحركة!"',
                    '"كن أقوى من أعذارك."',
                    '"٣٠ ثانية فقط من التمرين يمكنها تغيير يومك بالكامل."'
                ],
                workouts: [
                    { category: "🔥 كارديو", title: "القفز مع فتح الرجلين (Jumping Jacks)", desc: "اقفز وافتح يديك ورجليك لزيادة معدل ضربات القلب وطاقتك." },
                    { category: "💪 قوة", title: "تمرين الضغط (Push-ups)", desc: "حافظ على استقامة جسمك وركز على الصدر والذراعين." },
                    { category: "🧘 يوغا وتمدد", title: "وضعية القط والبقرة (Cat-Cow)", desc: "على يديك وركبتيك، قم بتحريك ظهرك للأعلى وللأسفل لإراحة العمود الفقري." },
                    { category: "💪 قوة", title: "القرفصاء (Squats)", desc: "انزل كأنك تجلس على كرسي، واجعل عضلات ساقيك أقوى." },
                    { category: "🔥 كارديو", title: "رفع الركبتين العالي (High Knees)", desc: "اركض في مكانك مع رفع الركبتين إلى مستوى الخصر." },
                    { category: "💪 قوة", title: "اللواح (Plank)", desc: "اشد عضلات بطنك وحافظ على استقامة جسمك." }
                ],
                btnStart: "ابدأ",
                btnPause: "إيقاف مؤقت",
                btnNext: "التمرين التالي ↻",
                statCompleted: "التمارين المكتملة",
                statEnergy: "مستوى الطاقة",
                btnReset: "إعادة ضبط الإحصائيات 🗑️",
                alertFinished: "أحسنت! أكملت التمرين بنجاح 🎉"
            },
            en: {
                dir: "ltr",
                title: "⚡ Endless Energy",
                quotes: [
                    '"Consistency is key. Take one step further today!"',
                    '"Energy flows where attention goes. Get moving!"',
                    '"Be stronger than your excuses."',
                    '"Just 30 seconds of workout can transform your day."'
                ],
                workouts: [
                    { category: "🔥 Cardio", title: "Jumping Jacks", desc: "Jump while spreading arms and legs to boost your heart rate." },
                    { category: "💪 Strength", title: "Push-ups", desc: "Keep your body straight and focus on your chest and arms." },
                    { category: "🧘 Yoga & Stretch", title: "Cat-Cow Stretch", desc: "On hands and knees, arch and round your back to relax your spine." },
                    { category: "💪 Strength", title: "Squats", desc: "Lower your hips as if sitting in a chair, build leg strength." },
                    { category: "🔥 Cardio", title: "High Knees", desc: "Run in place bringing knees up toward your chest." },
                    { category: "💪 Strength", title: "Plank", desc: "Engage your core and maintain a straight line from head to heels." }
                ],
                btnStart: "Start",
                btnPause: "Pause",
                btnNext: "Next Workout ↻",
                statCompleted: "Completed Workouts",
                statEnergy: "Energy Level",
                btnReset: "Reset Stats 🗑️",
                alertFinished: "Great job! You completed the workout 🎉"
            }
        };

        let currentLang = 'ckb';
        let currentWorkoutIndex = 0;
        let timerSeconds = 30;
        let timerInterval = null;
        let isRunning = false;
        let completedCount = parseInt(localStorage.getItem('activeLife_completedCount')) || 0;

        // Initialize App
        window.onload = function() {
            document.getElementById('stat-count').innerText = completedCount;
            updateEnergyLevel();
            changeLanguage('ckb');
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const data = i18n[lang];

            // Update Direction and UI labels
            document.documentElement.dir = data.dir;
            document.documentElement.lang = lang;
            document.getElementById('app-title').innerText = data.title;
            document.getElementById('stat-completed-label').innerText = data.statCompleted;
            document.getElementById('stat-energy-label').innerText = data.statEnergy;
            document.getElementById('btn-reset-stats').innerText = data.btnReset;

            updateQuote();
            updateWorkoutUI();
            updateButtonText();
        }

        function updateQuote() {
            const quotes = i18n[currentLang].quotes;
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote-text').innerText = randomQuote;
        }

        function updateWorkoutUI() {
            const workout = i18n[currentLang].workouts[currentWorkoutIndex];
            document.getElementById('workout-category').innerText = workout.category;
            document.getElementById('workout-title').innerText = workout.title;
            document.getElementById('workout-desc').innerText = workout.desc;
        }

        function updateButtonText() {
            const data = i18n[currentLang];
            document.getElementById('btn-start').innerText = isRunning ? data.btnPause : data.btnStart;
            document.getElementById('btn-next').innerText = data.btnNext;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
            } else {
                isRunning = true;
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        renderTimer();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        
                        // Play Sound
                        playFinishSound();
                        
                        // Update Saved Stats
                        completedCount++;
                        localStorage.setItem('activeLife_completedCount', completedCount);
                        document.getElementById('stat-count').innerText = completedCount;
                        updateEnergyLevel();

                        resetTimer();
                        alert(i18n[currentLang].alertFinished);
                    }
                }, 1000);
            }
            updateButtonText();
        }

        function renderTimer() {
            const sec = timerSeconds < 10 ? `0${timerSeconds}` : timerSeconds;
            document.getElementById('timer').innerText = `00:${sec}`;
        }

        function resetTimer() {
            timerSeconds = 30;
            renderTimer();
            updateButtonText();
        }

        function nextWorkout() {
            clearInterval(timerInterval);
            isRunning = false;
            resetTimer();
            const workouts = i18n[currentLang].workouts;
            currentWorkoutIndex = (currentWorkoutIndex + 1) % workouts.length;
            updateWorkoutUI();
            updateQuote();
        }

        function updateEnergyLevel() {
            let energyVal = 100 + (completedCount * 10);
            document.getElementById('stat-energy').innerText = `${energyVal}% 🔥`;
        }

        function resetStats() {
            if (confirm(currentLang === 'ckb' ? 'ئایا دڵنیایت لە سڕینەوەی ئامارەکانت؟' : 
                        currentLang === 'ar' ? 'هل أنت تأكد من إعادة ضبط الإحصائيات؟' : 
                        'Are you sure you want to reset your stats?')) {
                completedCount = 0;
                localStorage.removeItem('activeLife_completedCount');
                document.getElementById('stat-count').innerText = 0;
                updateEnergyLevel();
            }
        }
    </script>
</body>
</html>
